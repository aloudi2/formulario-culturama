<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pesquisa culturama</title>
  </head>
  <body>
    <header>
      <h1>Dados pessoais</h1>
    </header>
    <main>
      <section>
        <form action="" method="get">
          <fieldset>
            <!--DADOS PESSOAIS-->
            <legend>Dados pessoais</legend>
            <label for="name">Nome</label>
            <input id="name" type="text" name="userName" required />
            <br />
            <label for="age">Idade</label>
            <input
              id="age"
              type="number"
              name="userAge"
              min="12"
              max="100"
              required
            />
            <br />
            <label for="date">Data de nascimento</label>
            <input id="date" type="date" name="birthdate" />
            <br />
            <label for="email">Email</label>
            <input id="email" type="email" name="userEmail" required />
            <br />
            <label for="PhoneNumber">Telefone</label>
            <input
              id="PhoneNumber"
              type="tel"
              name="userPhoneNumber"
              pattern="[0-9]{11}"
              placeholder="(DDD)+ números sem espaço ou hifen"
            />
            <br />
            <label for="fotoperfil">Foto de perfil</label>
            <input
              id="fotoperfil"
              type="file"
              accept="imagens/*"
              name="userPerfil"
            />
            <br />
          </fieldset>

          <fieldset>
            <legend>Perfil</legend>

            <p>Genero:</p>
            <input id="fem" type="radio" name="userGender" value="feminino" />
            <label for="fem">Feminino</label>
            <input type="radio" name="userGender" value="masculino" id="mas" />
            <label for="mas">Masculino</label>
            <input type="radio" name="userGender" value="Outro" id="other" />
            <label for="other">Outro</label>
            <br />

            <!--Estado civil-->
            <label for="estadocivil">Estado civil</label>
            <select id="estadocivil" name="maritalStatus">
              <option value="notinformed">Selecione</option>
              <option value="Casado">Casado</option>
              <option value="Solteiro">Solteiro</option>
              <option value="Divorciado">Divorciado</option>
              <option value="União estavel">União estavel</option>
            </select>

            <!--Estado de nasçença-->
            <label for="estadousuario">Estado:</label>
            <select id="estadousuario" name="Userstate" required>
              <option value="notinformed">Selecione</option>
              <option value="AC">Acre</option>
              <option value="AL">Alagoas</option>
              <option value="AP">Amapá</option>
              <option value="AM">Amazonas</option>
              <option value="BA">Bahia</option>
              <option value="CE">Ceará</option>
              <option value="DF">Distrito Federal</option>
              <option value="ES">Espírito Santo</option>
              <option value="GO">Goiás</option>
              <option value="MA">Maranhão</option>
              <option value="MT">Mato Grosso</option>
              <option value="MS">Mato Grosso do Sul</option>
              <option value="MG">Minas Gerais</option>
              <option value="PA">Pará</option>
              <option value="PB">Paraíba</option>
              <option value="PR">Paraná</option>
              <option value="PE">Pernambuco</option>
              <option value="PI">Piauí</option>
              <option value="RJ">Rio de Janeiro</option>
              <option value="RN">Rio Grande do Norte</option>
              <option value="RS">Rio Grande do Sul</option>
              <option value="RO">Rondônia</option>
              <option value="RR">Roraima</option>
              <option value="SC">Santa Catarina</option>
              <option value="SP">São Paulo</option>
              <option value="SE">Sergipe</option>
              <option value="TO">Tocantins</option>
            </select>
            <br />

            <!--Cidade-->
            <label for="cidade">Cidade</label>
            <input id="cidade" type="text" name="userCity" />
          </fieldset>

          <fieldset>
            <legend>Habitos</legend>
            <p>Redes Sociais</p>
            <input type="checkbox" name="social" id="insta" value="instagram" />
            <label for="insta">Instagram</label>
            <br />
            <input type="checkbox" name="social" id="tik" value="tiktok" />
            <label for="tik">Tiktok</label>
            <br />
            <input type="checkbox" name="social" id="face" value="facebook" />
            <label for="face">Facebook</label>
            <br />
            <input type="checkbox" name="social" id="twiter" value="x" />
            <label for="twiter">X (Twitter)</label>
            <br />

            <label for="musicStyle">Estilo musical: </label>
            <input
              list="styletypes"
              id="musicSyle"
              type="text"
              name="userMusicStyle"
            />
            <datalist id="styletypes">
              <option value="rock"></option>
              <option value="pop"></option>
              <option value="samba"></option>
            </datalist>
            <br />

            <label for="favoriteColor"></label>
            <input type="color" name="UserFavoriteColor" id="favoriteColor" />

            <br />
            <p>Como você avalia nossos serviços:</p>
            <br />
            <input type="radio" name="opinionUser" id="excellent" />
            <label for="excellent" value="otima">Otima</label><br />

            <input type="radio" name="opinionUser" id="good" />
            <label for="good" value="boa">Boa</label><br />

            <input type="radio" name="opinionUser" id="regular" />
            <label for="regular" value="regular">Regular</label><br />

            <input type="radio" name="opinionUser" id="bad" />
            <label for="bad" value="ruim">Ruim</label><br />
            <br />

            <label for="feedback">Feedback</label>
            <textarea
              id="feedback"
              name="feedbackuser"
              placeholder="Digite sua opinião.."
            ></textarea>
          </fieldset>

          <!--bOTÃO ENVIAR-->
          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>
  </body>
</html>
